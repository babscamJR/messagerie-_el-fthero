<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ma Messagerie</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- Barre latérale -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1 id="titre-app" title="Messagerie">
          <svg class="logo-mini" viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="90" rx="62" ry="28" fill="none" stroke="#27ae60" stroke-width="11" transform="rotate(-30 100 90)"/>
            <path d="M100 46 Q107 84 135 90 Q107 96 100 134 Q93 96 65 90 Q93 84 100 46 Z" fill="#2ecc71"/>
          </svg>
          <span>Messagerie</span>
        </h1>
        <button id="admin-btn" class="cache">🛡️ Modération</button>
        <button id="deconnexion-btn" title="Se déconnecter">Déconnexion</button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-titre">Salons</div>
        <div id="liste-salons"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-titre">Messages privés</div>
        <div id="liste-utilisateurs"></div>
      </div>
    </div>

    <!-- Zone de chat -->
    <div class="chat-container">
      <div id="fond-cubes" class="cache" aria-hidden="true"></div>

      <div class="chat-header">
        <span id="titre-conversation">📻 Radio 1</span>
        <button id="retour-btn" class="mobile-only">← Retour</button>
      </div>

      <!-- Vue forum (Radio 2) -->
      <div id="forum-box" class="cache">
        <button id="btn-nouvelle-pub">✍️ Écrire une histoire</button>
        <div id="liste-publications"></div>
      </div>

      <div id="chat-box">
        <div class="flou-progressif flou-haut" aria-hidden="true">
          <div class="flou-couche"></div>
          <div class="flou-couche"></div>
          <div class="flou-couche"></div>
          <div class="flou-couche"></div>
        </div>

        <div id="messages"></div>

        <div id="panneau-emoji" class="cache">
          <div id="onglets-emoji"></div>
          <div id="grille-emoji"></div>
        </div>

        <div id="apercu-image" class="apercu-cache">
          <img id="apercu-img" alt="Aperçu">
          <button type="button" id="annuler-image" title="Retirer l'image">✕</button>
        </div>

        <form id="message-form">
          <input type="file" id="input-fichier" accept="image/*" hidden>
          <button type="button" id="btn-image" title="Envoyer une image">📎</button>
          <button type="button" id="btn-emoji" title="Emojis">😀</button>
          <input type="text" id="message-input" placeholder="Écris un message..." autocomplete="off">
          <button type="submit" id="btn-envoyer">Envoyer</button>
        </form>
      </div>
    </div>

  </div>

  <!-- Fenêtre : saisie de la clé admin -->
  <!-- Fenêtre : créer une publication -->
  <div id="modal-publication" class="modal cache">
    <div class="modal-contenu large">
      <h2>✍️ Nouvelle histoire</h2>
      <input type="text" id="pub-titre" placeholder="Titre de ton histoire" maxlength="200">
      <textarea id="pub-contenu" placeholder="Raconte ton histoire..." rows="7"></textarea>
      <input type="file" id="pub-image" accept="image/*" hidden>
      <button type="button" id="pub-btn-image" class="secondaire">📎 Ajouter une image</button>
      <div id="pub-apercu" class="cache">
        <img id="pub-apercu-img" alt="Aperçu">
        <button type="button" id="pub-annuler-image">✕</button>
      </div>
      <p id="pub-erreur" class="erreur-modal"></p>
      <div class="modal-actions">
        <button id="pub-publier">Publier</button>
        <button id="pub-fermer" class="secondaire">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Fenêtre : détail d'une publication avec ses commentaires -->
  <div id="modal-detail" class="modal cache">
    <div class="modal-contenu large">
      <div id="detail-contenu"></div>
      <div id="detail-commentaires"></div>
      <div id="detail-form-commentaire">
        <input type="text" id="input-commentaire" placeholder="Ajouter un commentaire..." autocomplete="off">
        <button id="envoyer-commentaire">Envoyer</button>
      </div>
      <div class="modal-actions">
        <button id="detail-fermer" class="secondaire">Fermer</button>
      </div>
    </div>
  </div>

  <div id="modal-cle" class="modal cache">
    <div class="modal-contenu">
      <h2>Accès modération</h2>
      <input type="password" id="input-cle" placeholder="Clé d'accès">
      <p id="erreur-cle" class="erreur-modal"></p>
      <div class="modal-actions">
        <button id="valider-cle">Valider</button>
        <button id="fermer-cle" class="secondaire">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Fenêtre : panneau de modération -->
  <div id="modal-admin" class="modal cache">
    <div class="modal-contenu large">
      <h2>🛡️ Panneau de modération</h2>
      <div id="liste-admin"></div>
      <div class="modal-actions">
        <button id="fermer-admin" class="secondaire">Fermer</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
