<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connexion - Ma Messagerie</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-container">
    <svg class="logo-auth" viewBox="0 0 200 200" aria-hidden="true">
        <ellipse cx="100" cy="82" rx="58" ry="26" fill="none" stroke="#27ae60" stroke-width="9" transform="rotate(-30 100 82)"/>
        <path d="M100 42 Q106 76 132 82 Q106 88 100 122 Q94 88 68 82 Q94 76 100 42 Z" fill="#2ecc71"/>
        <rect x="64" y="148" width="14" height="14" fill="#2ecc71"/>
        <rect x="93" y="148" width="14" height="14" fill="#27ae60"/>
        <rect x="122" y="148" width="14" height="14" fill="#1a6b40"/>
      </svg>
      <h1>Connexion</h1>

    <form id="form-connexion">
      <input type="text" id="pseudo" placeholder="Pseudo" required>
      <input type="password" id="motdepasse" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>

    <p id="message-erreur" class="erreur"></p>

    <p class="lien">Pas encore de compte ? <a href="/inscription.html">Inscris-toi</a></p>
  </div>

  <script>
    const form = document.getElementById("form-connexion");
    const messageErreur = document.getElementById("message-erreur");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const pseudo = document.getElementById("pseudo").value;
      const motdepasse = document.getElementById("motdepasse").value;

      const reponse = await fetch("/connexion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pseudo, motdepasse })
      });

      const data = await reponse.json();

      if (data.succes) {
        window.location.href = "/";
      } else {
        messageErreur.textContent = data.erreur;
      }
    });
  </script>
</body>
</html>
